name: CI — Forgejo

# The quality gate for lebon-grace: typecheck + unit tests + lint + build +
# Playwright smoke.
#
# WHY FORGEJO AND NOT GITHUB ACTIONS
# GitHub Actions is halted account-wide following a $256.70 bill, so anything
# under .github/workflows does not run. A CI file there would be worse than no
# CI: it would look like changes were being checked while nothing executed.
# Do not add one unless Actions has been confirmed restored.
#
# RUNNER LABELS
# `runs-on: docker` — the estate's act_runner advertises `docker`
# (node:20-bookworm) and `docker-large` (catthehacker/ubuntu:act-22.04). It does
# NOT advertise `ubuntu-latest`; a job requesting that label is never scheduled
# and simply hangs. setup-node then installs the version we actually want.
#
# ACTION REFERENCES ARE FULLY QUALIFIED
# `https://code.forgejo.org/actions/...` rather than bare `actions/...`, matching
# mirrortales. Bare names depend on the instance's action-resolution mirror.
#
# `continue-on-error` IS IGNORED BY FORGEJO — soften a step with `|| true`
# instead, as the lint step below does.

on:
  push:
    # Not just [main]: production currently deploys `fix/email-sender-domain`,
    # and main sits 54 commits behind it. Gating only main would check a branch
    # nobody ships.
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-forgejo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: docker
    # Raised from 20: the browser install and E2E run add a few minutes.
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ── Hard gates: both pass today, so a failure is a real regression ──────
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Was `|| true` while 51 pre-existing problems would have made this red on
      # arrival — and a permanently-red pipeline is one people learn to ignore,
      # which is how the dead Vercel check on PR #1 got scrolled past for days.
      # src/ is at zero now, so it is a real gate. --report-unused-disable-
      # directives so the suppressions cannot quietly rot either.
      - name: Lint
        run: npx eslint --report-unused-disable-directives

      # `next build` peaks around 3–4 GiB. If the runner's job container is
      # capped below that this step OOMs rather than failing cleanly.
      #
      # The build tolerates placeholder values for server-side secrets — that is
      # how ops/selfhost/scripts/build-apps.sh has always built it — but the
      # NEXT_PUBLIC_* pair is inlined into client bundles, so real values are
      # needed for a build that is meant to be shipped. These are read from
      # Forgejo repo secrets; if unset, the build still completes and only the
      # client-side Supabase config is wrong, which CI does not exercise.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # ── E2E smoke (MASTER-QA-PROTOCOL §6 Module B / §7 release gate) ────────
      # The suite and the shared kit already existed; nothing ran them, which is
      # the same failure class as a green build that never deployed — a check
      # that reports nothing is indistinguishable from a check that passes.
      #
      # BUNDLED CHROMIUM, NOT EDGE. ops/qa pins `channel: "msedge"` and calls it
      # non-negotiable, but a channel names the *installed* browser and this
      # container has no Edge, so every test would fail at launch and read as an
      # outage rather than a failure. CLAUDE.md also supersedes the Edge-only
      # rule in favour of Chrome. playwright.config.ts therefore leaves `channel`
      # unset unless QA_BROWSER_CHANNEL says otherwise.
      #
      # --with-deps installs the system libraries headless Chromium needs; the
      # node:20-bookworm image does not ship them.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # All three projects: desktop 1920x1080, iPhone-class and Android-class
      # (§2.3). 126 tests in about two minutes locally — a gate earns trust by
      # being fast and never flaky, and this is both.
      #
      # The mobile-only suite skips itself on desktop rather than living in a
      # separate config, so the skip list documents which behaviours exist only
      # below the `lg` breakpoint.
      #
      # Playwright starts the app itself (webServer in playwright.config.ts),
      # serving .next/standalone — the artifact the container actually runs —
      # so this exercises production's server, not a near-neighbour. It needs
      # the Build step above to have produced it.
      - name: E2E (desktop + mobile viewports)
        run: npx playwright test

      # Evidence for a red run: trace, video, screenshots. Without this a CI
      # failure is a stack trace and a guess.
      - name: Upload Playwright report
        if: failure()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

name: CI — Forgejo

# The quality gate for lebon-grace: typecheck + unit tests + lint + build +
# Playwright smoke.
#
# WHY FORGEJO AND NOT GITHUB ACTIONS
# GitHub Actions is halted account-wide following a $256.70 bill, so anything
# under .github/workflows does not run. A CI file there would be worse than no
# CI: it would look like changes were being checked while nothing executed.
# Do not add one unless Actions has been confirmed restored.
#
# RUNNER LABELS
# `runs-on: docker` — the estate's act_runner advertises `docker`
# (node:20-bookworm) and `docker-large` (catthehacker/ubuntu:act-22.04). It does
# NOT advertise `ubuntu-latest`; a job requesting that label is never scheduled
# and simply hangs. setup-node then installs the version we actually want.
#
# ACTION REFERENCES ARE FULLY QUALIFIED
# `https://code.forgejo.org/actions/...` rather than bare `actions/...`, matching
# mirrortales. Bare names depend on the instance's action-resolution mirror.
#
# `continue-on-error` IS IGNORED BY FORGEJO — soften a step with `|| true`
# instead, as the lint step below does.

on:
  push:
    # Not just [main]: production currently deploys `fix/email-sender-domain`,
    # and main sits 54 commits behind it. Gating only main would check a branch
    # nobody ships.
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-forgejo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: docker
    # Raised from 20: the browser install and E2E run add a few minutes.
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Runs BEFORE install, because a lockfile that is broken for another
      # platform still installs perfectly here. The container is built on
      # node:22-alpine (musl); this runner is glibc, so npm resolves a
      # different set of optional platform packages and CI can stay green
      # while `docker build` fails. That is exactly what npm/cli#8320 did to
      # us -- @emnapi/core and @emnapi/runtime were missing, only Alpine
      # noticed, and the Dockerfile's fallback hid it by regenerating the
      # lockfile in-image.
      - name: Lockfile is complete for every platform
        run: node scripts/verify-lockfile.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ── Hard gates: both pass today, so a failure is a real regression ──────
      - name: Typecheck
        run: npx tsc --noEmit

      # The step above checks NONE of the E2E harness. tsconfig.json excludes
      # ops/qa, playwright.config.ts and tests/** so that `next build` does not
      # fail on type errors in code this app does not own — and Playwright
      # transpiles specs with esbuild without type-checking them. So a type
      # error in the vendored QA kit or in any spec passed typecheck, passed
      # lint, and was invisible until it broke at runtime.
      #
      # tsconfig.e2e.json exists precisely to cover that gap and nothing had
      # ever invoked it. Same shape as the workflow itself: written, never run.
      - name: Typecheck the E2E harness
        run: npm run typecheck:e2e

      - name: Unit tests
        run: npm test

      # Was `|| true` while 51 pre-existing problems would have made this red on
      # arrival — and a permanently-red pipeline is one people learn to ignore,
      # which is how the dead Vercel check on PR #1 got scrolled past for days.
      # src/ is at zero now, so it is a real gate. --report-unused-disable-
      # directives so the suppressions cannot quietly rot either.
      - name: Lint
        run: npx eslint --report-unused-disable-directives

      # `next build` peaks around 3–4 GiB. If the runner's job container is
      # capped below that this step OOMs rather than failing cleanly.
      #
      # The build tolerates placeholder values for server-side secrets — that is
      # how ops/selfhost/scripts/build-apps.sh has always built it — but the
      # NEXT_PUBLIC_* pair is inlined into client bundles, so real values are
      # needed for a build that is meant to be shipped. These are read from
      # Forgejo repo secrets; if unset, the build still completes and only the
      # client-side Supabase config is wrong, which CI does not exercise.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # ── E2E smoke (MASTER-QA-PROTOCOL §6 Module B / §7 release gate) ────────
      # The suite and the shared kit already existed; nothing ran them, which is
      # the same failure class as a green build that never deployed — a check
      # that reports nothing is indistinguishable from a check that passes.
      #
      # BUNDLED CHROMIUM, NOT EDGE. ops/qa pins `channel: "msedge"` and calls it
      # non-negotiable, but a channel names the *installed* browser and this
      # container has no Edge, so every test would fail at launch and read as an
      # outage rather than a failure. CLAUDE.md also supersedes the Edge-only
      # rule in favour of Chrome. playwright.config.ts therefore leaves `channel`
      # unset unless QA_BROWSER_CHANNEL says otherwise.
      #
      # --with-deps installs the system libraries headless Chromium needs; the
      # node:20-bookworm image does not ship them.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # All three projects: desktop 1920x1080, iPhone-class and Android-class
      # (§2.3). 126 tests in about two minutes locally — a gate earns trust by
      # being fast and never flaky, and this is both.
      #
      # The mobile-only suite skips itself on desktop rather than living in a
      # separate config, so the skip list documents which behaviours exist only
      # below the `lg` breakpoint.
      #
      # Playwright starts the app itself (webServer in playwright.config.ts),
      # serving .next/standalone — the artifact the container actually runs —
      # so this exercises production's server, not a near-neighbour. It needs
      # the Build step above to have produced it.
      - name: E2E (desktop + mobile viewports)
        run: npx playwright test

      # Evidence for a red run: trace, video, screenshots. Without this a CI
      # failure is a stack trace and a guess.
      #
      # continue-on-error, because THE UPLOAD IS NOT THE GATE. On 2026-08-11 it
      # failed with ECONNREFUSED 127.0.0.1:3900 and five 500s from the artifact
      # service, and that turned a job into a failure whose only real problem
      # was that the evidence could not be filed. Losing the screenshots is
      # annoying; losing the test result underneath them is misleading — you go
      # looking for a bug in the app and the bug is in the artifact store.
      #
      # It only runs `if: failure()`, so this cannot mask a passing run. The
      # job's verdict is already decided by the time it executes.
      #
      # The underlying cause is a runner pointed at localhost:3900 for uploads,
      # which is the SSH-tunnel port, not the address the runner can reach
      # (forgejo:3000 works — the checkout step uses it in the same job). That
      # is runner configuration on shared infrastructure, so it is flagged
      # rather than changed here.
      - name: Upload Playwright report
        if: failure()
        continue-on-error: true
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  lifecycle:
    name: Order lifecycle (real database)
    runs-on: docker
    timeout-minutes: 15

    # An EPHEMERAL database per run, not the long-lived staging stack.
    #
    # Forgejo Actions supports `services:` in GitHub's format: each is started
    # before the job, shares the job's network, is addressable by name with no
    # port binding, and is destroyed afterwards. That is why this needs no
    # change to shared infrastructure — no attaching containers to the coolify
    # network, no permanent coupling between CI and a long-lived machine.
    #
    # Per-run beats pointing at the long-lived staging database: no shared state
    # between concurrent runs, no cleanup races, nothing left behind if a run is
    # cancelled, and CI does not go red because staging is down for maintenance.
    # It also re-applies every migration from nothing on every push, so a
    # migration that only works against an already-migrated database fails here
    # rather than at the next deploy.
    #
    # Same image versions as production. A test database on a different Postgres
    # is not a test database, it is a second thing to debug.
    #
    # NO kong, unlike production and the long-lived stack. Kong contributes
    # API-key auth, ACLs and CORS — none of which this suite exercises — and its
    # declarative config must be a mounted FILE, which a service container
    # cannot have because it starts before the repo is checked out. So the suite
    # talks to PostgREST directly with STAGING_REST_DIRECT=1. Both shapes were
    # verified against the long-lived stack before this job was written.
    services:
      db:
        image: public.ecr.aws/supabase/postgres:17.6.1.111
        env:
          # Throwaway, and deliberately in the open: this database is created
          # empty, holds only rows this suite invents, is reachable solely from
          # this job's network, and is destroyed when the job ends. Putting it
          # in a secret would imply it protects something.
          POSTGRES_PASSWORD: ci-ephemeral-not-a-real-password
          POSTGRES_DB: postgres
          JWT_SECRET: ci-ephemeral-jwt-secret-at-least-32-chars-long
      rest:
        image: public.ecr.aws/supabase/postgrest:v14.10
        env:
          # Connects as `postgres`, NOT the conventional `authenticator`.
          #
          # The supabase image does not give `authenticator` a password on a
          # fresh volume (supabase/supabase#18836), and it cannot be set from
          # here: it is a RESERVED role only a superuser may alter, `postgres`
          # is not a superuser in this image, and `supabase_admin` refuses a
          # passwordless connection from another container — the active pg_hba
          # trusts 127.0.0.1 only, and service traffic arrives from a 10.x
          # address. Verified by trying it.
          #
          # `postgres` is already a member of `anon` and `service_role`, which
          # is all PostgREST needs to switch roles per the JWT. Verified against
          # the long-lived stack: a real PostgREST wired this way answered 200
          # for a service_role query.
          PGRST_DB_URI: postgres://postgres:ci-ephemeral-not-a-real-password@db:5432/postgres
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: ci-ephemeral-jwt-secret-at-least-32-chars-long
          PGRST_DB_USE_LEGACY_GUCS: "false"

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install psql
        run: apt-get update -qq && apt-get install -y -qq postgresql-client

      - name: Wait for Postgres
        env:
          PGPASSWORD: ci-ephemeral-not-a-real-password
        run: |
          for i in $(seq 1 60); do
            if psql -h db -U postgres -d postgres -tAc 'select 1' >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "postgres never became ready" >&2; exit 1

      # Applying every migration from nothing is half the value of this job: it
      # proves the forward migrations still build the schema, on every push.
      #
      # The baseline is a production pg_dump restored into an image that already
      # owns the auth and storage schemas, so it emits ~300 harmless "already
      # exists" errors and is applied permissively. Any error touching `public`
      # fails the job — that is the part that matters.
      - name: Apply every migration from nothing
        env:
          PGPASSWORD: ci-ephemeral-not-a-real-password
        run: |
          for f in supabase/migrations/*.sql; do
            name=$(basename "$f")
            if [ "$name" = "00000000000000_baseline.sql" ]; then
              psql -h db -U postgres -d postgres -q -f "$f" >/dev/null 2>/tmp/mig.err || true
              if grep -q 'ERROR.*public\.' /tmp/mig.err; then
                echo "baseline failed inside the public schema:"
                grep 'ERROR.*public\.' /tmp/mig.err
                exit 1
              fi
              echo "  ok  $name (permissive — see comment)"
            else
              psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f" \
                || { echo "  FAIL $name"; exit 1; }
              echo "  ok  $name"
            fi
          done

      # The fail-closed proof-of-staging the suite demands. Without this row the
      # tests refuse to run, which is exactly the point: no marker, no writes.
      - name: Mark this database disposable
        env:
          PGPASSWORD: ci-ephemeral-not-a-real-password
        run: |
          psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -q -c "
            CREATE TABLE IF NOT EXISTS staging_marker (
              id int PRIMARY KEY DEFAULT 1,
              safe_to_destroy boolean NOT NULL DEFAULT true,
              note text NOT NULL,
              CONSTRAINT one_row CHECK (id = 1));
            INSERT INTO staging_marker (id, safe_to_destroy, note)
            VALUES (1, true, 'ephemeral CI database, destroyed when this job ends')
            ON CONFLICT (id) DO NOTHING;"

      # PostgREST caches the schema at connect time and never polls, so every
      # migration above is invisible to it until this NOTIFY. Without it the
      # suite fails with PGRST204 naming a column that demonstrably exists.
      - name: Reload the PostgREST schema cache
        env:
          PGPASSWORD: ci-ephemeral-not-a-real-password
        run: |
          psql -h db -U postgres -d postgres -q -c "NOTIFY pgrst, 'reload schema'"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://rest:3000/ || true)
            if [ "$code" = "200" ]; then echo "postgrest ready"; exit 0; fi
            sleep 2
          done
          echo "postgrest never became ready" >&2; exit 1

      - name: Order lifecycle against a real database
        env:
          STAGING_SUPABASE_URL: http://rest:3000
          STAGING_REST_DIRECT: "1"
        run: |
          # A service_role JWT signed with the throwaway secret above, built here
          # rather than committed — so there is no key-shaped string in the repo
          # for a scanner, or a human, to mistake for a real one.
          export STAGING_SUPABASE_SERVICE_KEY=$(node scripts/ci-service-jwt.mjs)
          npm run test:lifecycle

  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (staging app, on green only)
    runs-on: docker
    timeout-minutes: 15

    # THE GATE. Both jobs must have passed, and this must be main.
    #
    # `needs` gives the first half: a failing check or lifecycle job means this
    # never starts. `if` gives the second: a green branch build does not deploy.
    #
    # This is the whole point of SH-08. Deploying "from git" does not by itself
    # mean deploying something that works — auto-deploy-on-push is source-driven
    # and still ships whatever landed. The requirement is "never run a commit CI
    # has not passed", and that is a `needs:` edge, not a build pack.
    needs: [check, lifecycle]
    if: github.ref == 'refs/heads/main'

    steps:
      # Targets the STAGING application (lebon-grace-git), NOT the live shop.
      #
      # Production still deploys by hand until the domain moves in SH-08 Phase 5.
      # Wiring this to staging first means the automation is exercised on every
      # push for as long as it takes to trust it, while a mistake here costs a
      # throwaway container rather than the shop.
      #
      # When the domain does move, this same step becomes the production deploy
      # with no change other than the uuid — which is the point of doing it in
      # this order.
      - name: Trigger the Coolify build
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          APP_UUID: m11i6a5ekwhbflhnfb9ipr48
        run: |
          if [ -z "$COOLIFY_DEPLOY_TOKEN" ]; then
            echo "COOLIFY_DEPLOY_TOKEN is not set — refusing to continue." >&2
            echo "A missing secret must fail loudly. Skipping quietly would leave" >&2
            echo "the pipeline looking green while nothing had been deployed." >&2
            exit 1
          fi

          echo "Deploying ${GITHUB_SHA:-HEAD} to the staging application."

          # -f so a 4xx/5xx is a failure rather than a body written to stdout and
          # an exit code of 0. curl's default is to succeed on an HTTP error,
          # which is exactly how a deploy step ends up green while deploying
          # nothing.
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
            -H "Accept: application/json" \
            "https://app.coolify.io/api/v1/deploy?uuid=${APP_UUID}&force=false") || true

          echo "Coolify answered ${code}"
          cat /tmp/deploy.json 2>/dev/null || true
          echo

          case "$code" in
            2*) ;;
            *) echo "Coolify refused the deploy (${code})." >&2; exit 1 ;;
          esac

          # A queued deployment is not a finished one. Without this the job goes
          # green the moment the request is accepted, which says nothing about
          # whether the build worked — the same "accepted != done" mistake that
          # made a mail send look successful in B-30.
          uuid=$(node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              try { console.log(JSON.parse(d).deployments?.[0]?.deployment_uuid || '') }
              catch { console.log('') }
            });" < /tmp/deploy.json)

          if [ -z "$uuid" ]; then
            echo "No deployment uuid in the response — cannot confirm it ran." >&2
            exit 1
          fi
          echo "deployment ${uuid} queued; waiting for it to finish"

          for i in $(seq 1 60); do
            st=$(curl -sS -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
                   -H "Accept: application/json" \
                   "https://app.coolify.io/api/v1/deployments/${uuid}" \
                 | node -e "
                     let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
                       try { console.log(JSON.parse(d).status || 'unknown') } catch { console.log('unreadable') }
                     });")
            case "$st" in
              finished|success)          echo "deployment finished"; exit 0 ;;
              failed|error|cancelled*)   echo "deployment $st" >&2; exit 1 ;;
            esac
            sleep 20
          done

          echo "deployment did not finish within 20 minutes" >&2
          exit 1

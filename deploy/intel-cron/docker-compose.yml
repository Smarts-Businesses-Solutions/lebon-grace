# Nightly product-intelligence snapshot.
#
# Separate from the estate's `cron-selfhosted` container on purpose:
#   - that one drives HTTP endpoints with CRON_TIMEOUT=300, and a full sweep of
#     515 products at 2 req/s lands at 4-5 minutes — too close to the ceiling
#   - its crontab is generated by scripts/gen_crontab.py from vercel.json files
#     and is explicitly not to be hand-edited
#
# The scripts use only Node built-ins (fetch, fs), so no npm install is needed
# in this container. It reads .env.local from the mounted project for the CJ and
# Supabase credentials, exactly as a manual run does.
#
#   docker compose -f deploy/intel-cron/docker-compose.yml up -d
#   docker logs -f lebon-grace-intel-cron

services:
  intel-cron:
    image: node:22-alpine
    container_name: lebon-grace-intel-cron
    restart: unless-stopped
    working_dir: /app
    # Use the default bridge instead of a per-project network: this host has
    # exhausted Docker's predefined address pools (many compose projects), and
    # this container only needs outbound access to the CJ API and Supabase.
    network_mode: bridge
    environment:
      TZ: "UTC"
    volumes:
      # rw because the CJ client caches its access token as .cj_token.json in cwd
      - ../..:/app
      - ./crontab:/etc/supercronic/crontab:ro
      - ../../../ops/supercronic/vendor/supercronic:/usr/local/bin/supercronic:ro
    entrypoint: ["/usr/local/bin/supercronic", "-passthrough-logs", "/etc/supercronic/crontab"]
